<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>REO Dash — Rádio Escolar Online · AE de S. Bento, Vizela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --escuro:#0B0908;
    --painel:#17120E;
    --painel2:#221A13;
    --ambar:#E8A33C;
    --ouro:#FFD489;
    --creme:#F3E6D2;
    --perigo:#FF4A4A;
    --linha:rgba(243,230,210,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -15%, #2A1E14 0%, var(--escuro) 62%), var(--escuro);
    color:var(--creme);
    font-family:'Space Grotesk',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:14px;
  }
  .mesa{
    width:100%;max-width:900px;
    background:linear-gradient(180deg,var(--painel2) 0%,var(--painel) 100%);
    border:1px solid var(--linha);border-radius:20px;padding:14px;
    box-shadow:0 30px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .barra{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .selo{width:44px;height:44px;flex:none}
  .marca{display:flex;flex-direction:column;line-height:1}
  .marca b{font-size:1.2rem;letter-spacing:-.02em}
  .marca small{
    font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.13em;
    text-transform:uppercase;color:rgba(243,230,210,.45);margin-top:5px;
  }
  .onair{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.18em;
    padding:6px 12px;border-radius:6px;
    border:1px solid rgba(255,74,74,.3);background:rgba(255,74,74,.07);color:#FF9A9A;
  }
  .onair i{width:8px;height:8px;border-radius:50%;background:var(--perigo);
    box-shadow:0 0 10px var(--perigo);animation:pulsa 1.9s infinite}
  @keyframes pulsa{0%,100%{opacity:1}50%{opacity:.22}}

  .consola{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .mod{background:rgba(0,0,0,.3);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;min-width:0}
  .mod label{display:block;font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(243,230,210,.4);margin-bottom:3px}
  .mod output{font-family:'DM Mono',monospace;font-size:1.05rem;display:block}
  #vOuvintes{color:var(--ouro)} #vCombo{color:var(--ambar)} #vEmissao{color:var(--creme)}
  .vu{display:flex;gap:3px;margin-top:5px}
  .vu i{flex:1;height:8px;border-radius:2px;background:rgba(243,230,210,.1)}
  .vu i.on{background:var(--perigo);box-shadow:0 0 8px rgba(255,74,74,.55)}
  .nota{font-family:'DM Mono',monospace;font-size:.54rem;color:rgba(243,230,210,.34);margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;
    background:#0B0908;border:1px solid var(--linha);
    box-shadow:0 12px 30px rgba(0,0,0,.6);cursor:pointer;touch-action:manipulation}

  .comandos{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  button{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.9rem;border:none;
    border-radius:10px;padding:11px 20px;cursor:pointer;transition:transform .06s ease}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
  .principal{background:var(--ambar);color:#2A1705;box-shadow:0 4px 0 #97671E}
  .principal:active{box-shadow:0 1px 0 #97671E}
  .secundaria{background:rgba(243,230,210,.07);color:var(--creme);border:1px solid var(--linha)}
  .som{margin-left:auto;width:44px;padding:11px 0;text-align:center}
  .ajuda{margin-top:10px;font-family:'DM Mono',monospace;font-size:.62rem;line-height:1.75;color:rgba(243,230,210,.36)}
  .ajuda kbd{background:rgba(0,0,0,.45);border:1px solid var(--linha);border-radius:4px;padding:1px 6px;color:var(--creme)}
  #dash{position:fixed;right:16px;bottom:16px;display:none;z-index:5;width:76px;height:76px;
    border-radius:50%;background:rgba(232,163,60,.15);border:1px solid rgba(232,163,60,.5);
    color:var(--ambar);font-size:.66rem;letter-spacing:.1em;backdrop-filter:blur(6px)}
  body.toque #dash{display:block}
  @media (max-width:560px){
    .consola{grid-template-columns:repeat(2,1fr)}
    .marca b{font-size:1rem}
    .ajuda{font-size:.57rem}
  }
  @media (prefers-reduced-motion:reduce){.onair i{animation:none}}
</style>
</head>
<body>

<main class="mesa">
  <div class="barra">
    <canvas class="selo" id="selo" width="88" height="88" aria-hidden="true"></canvas>
    <div class="marca">
      <b>REO Dash</b>
      <small>Rádio Escolar Online · AE de S. Bento, Vizela · @REO_VIZELA_</small>
    </div>
    <div class="onair"><i></i> NO AR</div>
  </div>

  <div class="consola">
    <div class="mod"><label>Ouvintes</label><output id="vOuvintes">0</output>
      <div class="nota">recorde <span id="vRecorde">0</span></div></div>
    <div class="mod"><label>Audiência</label><output id="vCombo">x1</output>
      <div class="nota" id="vComboNota">sem cadeia</div></div>
    <div class="mod"><label>Sinal</label><output id="vSinal">3</output>
      <div class="vu" id="vu"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div></div>
    <div class="mod"><label>Etapa</label><output id="vEmissao">1</output>
      <div class="nota" id="vLocal">Estúdio da escola</div></div>
  </div>

  <canvas id="game" width="960" height="540" aria-label="Jogo REO Dash"></canvas>

  <div class="comandos">
    <button class="principal" id="bJogar">Jogar</button>
    <button class="secundaria" id="bRecomecar">Recomeçar</button>
    <button class="secundaria som" id="bSom" aria-label="Ligar ou desligar o som">♪</button>
  </div>

  <p class="ajuda">
    <kbd>Espaço</kbd> saltar (mantém para saltar mais alto) · <kbd>Shift</kbd> rolar ·
    <kbd>P</kbd> pausa<br>
    Apanha 🎤 microfones, ♪ notas e 🎧 auscultadores. Desvia-te de antenas, cabos e estática.
  </p>
</main>

<button id="dash">ROLAR</button>

(function(){
"use strict";

/* ═════════════ base ═════════════ */
const W = 960, H = 540, CHAO = 430;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d", { alpha:false });
const menosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function ajustar(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
ajustar();
window.addEventListener("resize", ajustar);
if (window.matchMedia("(pointer:coarse)").matches) document.body.classList.add("toque");

const R = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const TAU = Math.PI*2;

/* ═════════════ paleta (retirada do logótipo) ═════════════ */
const C = {
  ambar:"#E8A33C", ambarClaro:"#FFD489", ambarEsc:"#9A6519",
  massa1:"#2B2724", massa2:"#141210", massa3:"#0A0908",
  gravado:"#6E6862", gravadoClaro:"#A9A29A",
  creme:"#F3E6D2", perigo:"#FF4A4A", metal:"#6B6257", metalClaro:"#9C9184"
};

/* ═════════════ áudio ═════════════ */
let ac=null, mudo=false;
try { mudo = localStorage.getItem("reoMudo")==="1"; } catch(e){}
function beep(f,dur,tipo,vol){
  if (mudo) return;
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=tipo||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(vol||.07, ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur+.02);
  }catch(e){}
}
function ruido(dur){
  if (mudo) return;
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const n=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(), g=ac.createGain();
    s.buffer=b; g.gain.value=.11; s.connect(g); g.connect(ac.destination); s.start();
  }catch(e){}
}

   Bolacha escura, aro âmbar, bordo canelado, notas gravadas
   e a cartela oval com "REO" ao centro.                     */

function logoREO(g, r, opt){
  opt = opt || {};
  const brilho = opt.brilho === undefined ? 1 : opt.brilho;
  g.save();
  if (opt.glow !== false){
    g.shadowColor = "rgba(232,163,60,.7)";
    g.shadowBlur = 14*brilho;
  }
  if (logoPronto){
    g.drawImage(LOGO, -r, -r, r*2, r*2);
  } else {
    g.fillStyle = "#131317";
    g.beginPath(); g.arc(0,0,r*0.87,0,TAU); g.fill();
    g.strokeStyle = C.ambar; g.lineWidth = r*0.125;
    g.beginPath(); g.arc(0,0,r*0.936,0,TAU); g.stroke();
  }
  g.restore();
}

}

function camada(w,h,fn){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  fn(c.getContext("2d"), w, h); return c;
}

const ceu = camada(W, 320, (g,w,h) => {

    g.fillStyle = `rgba(243,230,210,${R(.1,.55)})`;
    g.beginPath(); g.arc(R(0,w), R(0,h), R(.4,1.5), 0, TAU); g.fill();
  }
  g.fillStyle="rgba(255,212,137,.10)"; g.beginPath(); g.arc(660,74,44,0,TAU); g.fill();
  g.fillStyle="rgba(255,212,137,.45)"; g.beginPath(); g.arc(660,74,29,0,TAU); g.fill();

});

});

// a vila: escola de S. Bento, igreja, termas
const vila = camada(W, 230, (g,w,h) => {
  function janelas(x,y,larg,alt){
    for(let jy=y+14; jy<y+alt-12; jy+=22)
      for(let jx=x+10; jx<x+larg-12; jx+=20){
        const on = Math.random()<.45;
        g.fillStyle = on ? (Math.random()<.2 ? "rgba(232,163,60,.6)" : "rgba(255,208,140,.42)")
                         : "rgba(243,230,210,.05)";
        g.fillRect(jx,jy,10,12);
      }
  }
  function bloco(x,larg,alt,telhado){
    const y=h-alt;
    g.fillStyle="#1B140F"; g.fillRect(x,y,larg,alt);
    g.fillStyle="rgba(232,163,60,.10)"; g.fillRect(x,y,larg,2);
    if(telhado){
      g.fillStyle="#120D09";
      g.beginPath(); g.moveTo(x-9,y); g.lineTo(x+larg/2,y-24); g.lineTo(x+larg+9,y);
      g.closePath(); g.fill();
    }
    janelas(x,y,larg,alt);
  }

  bloco(14,110,92,false);
  // escola (bloco central, mais largo, com letreiro)
  bloco(140,220,140,true);
  g.fillStyle="rgba(232,163,60,.16)"; g.fillRect(168,h-160,164,20);
  g.strokeStyle="rgba(232,163,60,.4)"; g.lineWidth=1; g.strokeRect(168,h-160,164,20);
  g.fillStyle="rgba(255,208,140,.85)";
  g.font="500 11px 'DM Mono', monospace"; g.textAlign="center";
  g.fillText("AE DE S. BENTO", 250, h-146);

  bloco(384,86,74,false);

  // igreja com torre sineira
  (function(){
    const x=494, y=h-118;
    g.fillStyle="#1B140F"; g.fillRect(x,y,120,118);
    g.fillStyle="#120D09";
    g.beginPath(); g.moveTo(x-8,y); g.lineTo(x+60,y-26); g.lineTo(x+128,y); g.closePath(); g.fill();
    g.fillStyle="#1B140F"; g.fillRect(x+46,y-88,28,90);
    g.fillStyle="#120D09";
    g.beginPath(); g.moveTo(x+42,y-88); g.lineTo(x+60,y-118); g.lineTo(x+78,y-88); g.closePath(); g.fill();
    g.fillStyle="rgba(255,208,140,.5)"; g.fillRect(x+55,y-72,10,12);
    janelas(x,y,120,118);
  })();

  bloco(646,104,86,false);

  // termas
  bloco(776,150,124,false);
  g.fillStyle="rgba(232,163,60,.14)"; g.fillRect(796,h-142,110,18);
  g.fillStyle="rgba(255,208,140,.7)";
  g.font="500 10px 'DM Mono', monospace"; g.textAlign="center";
  g.fillText("TERMAS", 851, h-129);
});

// telhados próximos
const telhados = camada(W, 160, (g,w,h) => {
  g.fillStyle="#100B08";
  const topos=[];
  for(let x=0;x<w;){
    const larg=R(80,160), alt=R(54,116);
    g.fillRect(x,h-alt,larg,alt);
    topos.push({x:x+larg/2,y:h-alt});
    x += larg + R(6,26);
  }
  topos.forEach((p,i)=>{
    if(i%3) return;
    g.strokeStyle="rgba(107,98,87,.5)"; g.lineWidth=2;
    g.beginPath(); g.moveTo(p.x-9,p.y); g.lineTo(p.x,p.y-48); g.lineTo(p.x+9,p.y); g.stroke();
    for(let k=1;k<4;k++){
      const t=k/4, yy=p.y-48*t, dx=9*(1-t);
      g.beginPath(); g.moveTo(p.x-dx,yy); g.lineTo(p.x+dx,yy); g.stroke();
    }
  });
});

  P.x=150; P.y=CHAO-P.r; P.vy=0; P.noChao=true; P.sx=1; P.sy=1; P.incl=0;
  obs=[]; itens=[]; powers=[]; part=[]; texto=[]; migalhas=[]; ondas=[]; placas=[];
  hud();
}

       led:[C.perigo,C.ambar,C.ambarClaro][Math.floor(R(0,3))],hb:{dx:6,dy:6,w:0,h:14}};

/* ═════════════ colisão ═════════════ */
function circuloRect(cx,cy,r,rx,ry,rw,rh){
  const nx=clamp(cx,rx,rx+rw), ny=clamp(cy,ry,ry+rh);
  const dx=cx-nx, dy=cy-ny;
  return dx*dx+dy*dy < r*r;
}

/* ═════════════ controlos ═════════════ */
let coyote=0, buffer=0, segurar=false;
function saltar(){
  if(!aJogar||fim||pausa) return;
  if(P.noChao||coyote>0){
    P.vy=-13.4; P.noChao=false; coyote=0; P.sx=.78; P.sy=1.26;
    migalha(P.x-6,P.y+P.r-4,5);
    beep(520,.12,"triangle",.05); beep(760,.1,"triangle",.03);
  } else buffer=8;
}
function soltarSalto(){ if(P.vy<-5.5) P.vy=-5.5; }
function rolar(){
  if(!aJogar||fim||pausa||rolarCD>0) return;
  rolarT=12; rolarCD=46; inv=Math.max(inv,16); giroAlvo+=TAU*2;
  faisca(P.x-10,P.y,14,C.ambar,1.8,1.1);
  anel(P.x,P.y,"232,163,60");
  migalha(P.x,P.y+20,6);
  beep(240,.18,"sawtooth",.05);
}
document.addEventListener("keydown", e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); segurar=true; saltar(); }
  if(e.code==="ShiftLeft"||e.code==="ShiftRight"||e.key==="x"||e.key==="X"){ e.preventDefault(); rolar(); }
  if(e.key==="p"||e.key==="P"){ if(aJogar&&!fim) pausa=!pausa; }
  if(e.key==="Enter") comecar();
});
document.addEventListener("keyup", e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){ segurar=false; soltarSalto(); }
});
cv.addEventListener("pointerdown", e=>{ e.preventDefault(); segurar=true; saltar(); });
cv.addEventListener("pointerup", ()=>{ segurar=false; soltarSalto(); });
cv.addEventListener("pointerleave", ()=>{ segurar=false; });
document.getElementById("dash").addEventListener("pointerdown", e=>{ e.preventDefault(); rolar(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden&&aJogar) pausa=true; });

function comecar(){

}

bSom.onclick = ()=>{

/* ═════════════ lógica ═════════════ */
function atualizar(d){
  T += d;
  if(!aJogar||fim||pausa) return;

  if(rolarCD>0) rolarCD-=d;
  if(inv>0) inv-=d;
  if(tremor>.3) tremor*=Math.pow(.86,d);
  if(flashDano>0) flashDano-=d*.04;
  if(flashNivel>0) flashNivel-=d*.02;
  if(comboT>0){ comboT-=d; if(comboT<=0&&combo>1){ combo=1; hud(); } }

  if(rolarT>0){ rolarT-=d; P.x+=7.5*d; }
  else P.x += (150-P.x)*.07*d;
  giro += (giroAlvo-giro)*.14*d;
  if(Math.abs(giroAlvo-giro)<.004){ giro=0; giroAlvo=0; }

  const g = P.vy<0 ? .62 : .86;
  if(segurar&&P.vy<0) P.vy-=.16*d;
  P.vy += g*d; P.y += P.vy*d;

  if(P.y >= CHAO-P.r){
    P.y=CHAO-P.r;
    if(!P.noChao){ P.sx=1.2; P.sy=.82; P.noChao=true; migalha(P.x,CHAO-4,6); beep(180,.08,"sine",.03); }
    P.vy=0; coyote=0;
    if(buffer>0){ buffer=0; saltar(); }
  } else {
    if(P.noChao) coyote=8;
    P.noChao=false;
    if(coyote>0) coyote-=d;
    if(buffer>0) buffer-=d;
  }
  P.sx += (1-P.sx)*.18*d;
  P.sy += (1-P.sy)*.18*d;
  P.incl += ((P.noChao? clamp(P.vy*.012,-.2,.2) : 0) - P.incl)*.2*d;

  mgX[0]+=vel*.07*d; mgX[1]+=vel*.17*d; mgX[2]+=vel*.35*d; mgX[3]+=vel*.62*d;

  const nn = Math.floor(ouvintes/16)+1;
  if(nn!==nivel){
    nivel=nn;
    vel=Math.min(11, 4.4+(nivel-1)*.62);
    flashNivel=1;
    aviso(W/2,150, localAtual().toUpperCase(), C.ambarClaro, 24);
    faisca(W/2,H/2,26,C.ambar,2.4,1.3);
    beep(880,.2,"square",.05); beep(1180,.22,"square",.03);
    hud();
  }

  spawnT+=d;
  const intervalo = Math.max(34, 74-nivel*3)/(vel/4.4);
  if(spawnT>=intervalo && (W-ultimoX)>vel*26){ novoObstaculo(); spawnT=0; }
  ultimoX -= vel*d;
  itemT+=d; if(itemT>=Math.max(38,68-nivel*2)){ novoItem(); itemT=0; }
  powerT+=d; if(powerT>=Math.max(420,620-nivel*20)){ novoPower(); powerT=0; }
  placaT+=d; if(placaT>=R(420,700)){ novaPlaca(); placaT=0; }
  anuncioT+=d;
  if(anuncioT>=R(560,900)){
    anuncioT=0;
    aviso(W/2, 108, ANUNCIOS[Math.floor(R(0,ANUNCIOS.length))], "rgba(255,212,137,.9)", 16);
  }

  for(let i=placas.length-1;i>=0;i--){
    placas[i].x -= vel*.62*d;
    if(placas[i].x<-140) placas.splice(i,1);
  }

  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    o.x-=vel*d; o.f+=.07*d;
    if(circuloRect(P.x,P.y,P.r*.72, o.x+o.hb.dx, o.y+o.hb.dy, o.hb.w, o.hb.h)){
      if(inv<=0){
        sinal--; hud();
        tremor=16; flashDano=1; combo=1; comboT=0;
        faisca(P.x,P.y,26,C.perigo,2.6,1.4);
        migalha(P.x,P.y,14);
        aviso(P.x,P.y-42,"SINAL PERDIDO",C.perigo,20);
        ruido(.35);
        if(sinal<=0){
          aJogar=false; fim=true;
          if(ouvintes>recorde){
            recorde=ouvintes;
            try{ localStorage.setItem("reoRecorde",recorde); }catch(e){}
            els.recorde.textContent=recorde;
          }
          return;
        }
        inv=110; obs.splice(i,1); continue;
      } else {
        faisca(o.x+o.w/2,o.y+o.h/2,12,C.ambarClaro,1.8,1);
        obs.splice(i,1); continue;
      }
    }
    if(o.x+o.w<-60) obs.splice(i,1);
  }

  for(let i=itens.length-1;i>=0;i--){
    const it=itens[i];
    it.x-=vel*d; it.osc+=.08*d; it.ang+=.06*d;
    const iy=it.y+Math.sin(it.osc)*8;
    const dx=P.x-it.x, dy=P.y-iy, dd=Math.hypot(dx,dy);
    if(combo>=3 && dd<150){ it.x+=dx*.06*d; it.y+=dy*.06*d; }
    if(dd < P.r+20){
      let p=1, msg="+1", cor=C.ambarClaro;
      if(it.tipo==="mic"){ p=3*combo; msg="+"+p+" ouvintes"; cor=C.ambarClaro; }
      else if(it.tipo==="auscultadores"){ p=combo; inv=Math.max(inv,140); msg="escudo"; cor="#8FD3C8"; }
      else { p=2*combo; msg="+"+p; cor=C.ambar; }
      ouvintes+=p; comboT=200; combo=Math.min(6,combo+1);
      faisca(it.x,iy,16,cor,2,1.1);
      anel(it.x,iy,"232,163,60");
      aviso(it.x,iy-32,msg,cor,17);
      beep(660+combo*90,.12,"sine",.05);
      hud(); itens.splice(i,1); continue;
    }
    if(it.x<-60) itens.splice(i,1);
  }

  for(let i=powers.length-1;i>=0;i--){
    const pw=powers[i];
    pw.x-=vel*d; pw.p+=.07*d;
    if(Math.hypot(P.x-pw.x,P.y-pw.y) < P.r+18){
      inv=200;
      if(sinal<5){ sinal++; hud(); }
      faisca(pw.x,pw.y,26,C.ambar,2.6,1.4);
      anel(pw.x,pw.y,"232,163,60");
      aviso(pw.x,pw.y-34,"REFORÇO DE SINAL",C.ambar,18);
      beep(520,.14,"square",.05); beep(780,.18,"square",.04);
      powers.splice(i,1); continue;
    }
    if(pw.x<-60) powers.splice(i,1);
  }

  for(let i=part.length-1;i>=0;i--){
    const p=part[i];
    p.x+=p.vx*d; p.y+=p.vy*d; p.vy+=.05*d; p.vida-=p.dec*d;
    if(p.vida<=0) part.splice(i,1);
  }
  for(let i=migalhas.length-1;i>=0;i--){
    const m=migalhas[i];
    m.x+=(m.vx-vel*.4)*d; m.y+=m.vy*d; m.vy+=.16*d; m.rot+=m.vr*d; m.vida-=.014*d;
    if(m.vida<=0||m.y>CHAO+10) migalhas.splice(i,1);
  }
  for(let i=texto.length-1;i>=0;i--){
    texto[i].y-=1.1*d; texto[i].vida-=.014*d;
    if(texto[i].vida<=0) texto.splice(i,1);
  }
  for(let i=ondas.length-1;i>=0;i--){
    ondas[i].r+=2.6*d; ondas[i].vida-=.03*d;
    if(ondas[i].vida<=0) ondas.splice(i,1);
  }
}

/* ═════════════ desenho: cenário ═════════════ */
function repetir(img, dx, y){
  const w=img.width;
  let x=-(((dx%w)+w)%w);
  for(; x<W; x+=w) ctx.drawImage(img,x,y);
}

function fundo(){
  const g=ctx.createLinearGradient(0,0,0,CHAO);
  g.addColorStop(0,"#0B0908"); g.addColorStop(.5,"#1A120C"); g.addColorStop(1,"#2A1C12");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.drawImage(ceu,0,0);

  // ondas da torre
  ctx.save();
  ctx.strokeStyle="rgba(232,163,60,.13)"; ctx.lineWidth=1.6;
  for(let k=0;k<4;k++){
    const r=((T*.7+k*70)%280)+30;
    ctx.globalAlpha=clamp(1-r/300,0,1)*.6;
    ctx.beginPath(); ctx.arc(824,118,r,Math.PI*.72,Math.PI*1.28); ctx.stroke();
  }
  ctx.restore();

  repetir(colinas, mgX[0], CHAO-172);
  repetir(vila,    mgX[1], CHAO-226);
  repetir(telhados,mgX[2], CHAO-150);
  torre(824,118);
  outdoor();
}

function torre(x,topo){
  const base=CHAO;
  ctx.strokeStyle="rgba(107,98,87,.55)"; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(x-30,base); ctx.lineTo(x,topo); ctx.lineTo(x+30,base); ctx.stroke();
  ctx.lineWidth=1.2;
  for(let k=1;k<7;k++){
    const t=k/7, y=base+(topo-base)*t, dx=30*(1-t);
    ctx.beginPath(); ctx.moveTo(x-dx,y); ctx.lineTo(x+dx,y); ctx.stroke();
    const t2=(k-.5)/7, y2=base+(topo-base)*t2, dx2=30*(1-t2);
    ctx.beginPath();
    ctx.moveTo(x-dx2,y2); ctx.lineTo(x+dx,y);
    ctx.moveTo(x+dx2,y2); ctx.lineTo(x-dx,y);
    ctx.stroke();
  }
  const b=.45+.45*Math.sin(T*.06);
  ctx.fillStyle=`rgba(255,74,74,${b})`;
  ctx.shadowColor=C.perigo; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.arc(x,topo-4,4.5,0,TAU); ctx.fill();
  ctx.shadowBlur=0;
  ctx.font="500 9px 'DM Mono', monospace"; ctx.textAlign="center";
  ctx.fillStyle="rgba(232,163,60,.45)";
  ctx.fillText("EMISSOR REO", x, base-6);
}

function chao(){
  const g=ctx.createLinearGradient(0,CHAO,0,H);
  g.addColorStop(0,"#241A12"); g.addColorStop(1,"#0D0907");
  ctx.fillStyle=g; ctx.fillRect(0,CHAO,W,H-CHAO);

  ctx.strokeStyle="rgba(232,163,60,.5)"; ctx.lineWidth=2;
  ctx.shadowColor=C.ambar; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.moveTo(0,CHAO); ctx.lineTo(W,CHAO); ctx.stroke();
  ctx.shadowBlur=0;

  ctx.strokeStyle="rgba(243,230,210,.07)"; ctx.lineWidth=3;
  for(let i=-1;i<20;i++){
    const x=i*56-(mgX[3]%56);

  }

  // marca de água no passeio
  ctx.save();
  ctx.globalAlpha=.06; ctx.fillStyle=C.ambarClaro;

    ctx.fillStyle=`rgba(232,163,60,${.07+h/180})`;
    ctx.fillRect(i*(W/barras)+4, H-h-6, W/barras-8, h);
  }
}

/* ═════════════ desenho: herói ═════════════ */
function heroi(){
  const {x,y,r}=P;

  const alto=clamp((CHAO-(y+r))/160,0,1);
  ctx.fillStyle=`rgba(0,0,0,${.45*(1-alto)})`;
  ctx.beginPath(); ctx.ellipse(x,CHAO+3,r*(1-alto*.35),7*(1-alto*.4),0,0,TAU); ctx.fill();

  if(rolarT>0){
    for(let k=1;k<=3;k++){
      ctx.globalAlpha=.10*(4-k);
      ctx.fillStyle=C.ambar;
      ctx.beginPath(); ctx.arc(x-k*22,y,r*.8,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if(inv>0 && Math.floor(T/5)%2===0) ctx.globalAlpha=.5;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(P.sx,P.sy);
  ctx.rotate(giro + P.incl + (P.noChao?0:Math.sin(T*.05)*.035));

  if(inv>60){
    ctx.strokeStyle=`rgba(143,211,200,${.35+.2*Math.sin(T*.12)})`;
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,r+10,0,TAU); ctx.stroke();
  }

  logoREO(ctx, r, {brilho: 1 + (inv>60?.6:0)});
  ctx.restore();
  ctx.globalAlpha=1;
}

/* ═════════════ desenho: obstáculos ═════════════ */
function etiqueta(txt,x,y,rgb){
  ctx.font="500 9px 'DM Mono', monospace";
  ctx.fillStyle=`rgba(${rgb},.55)`;
  ctx.fillText(txt,x,y);
}
function desenhaObstaculos(){
  ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  for(const o of obs){
    if(o.tipo==="antena"){
      const x=o.x+o.w/2, base=CHAO, topo=o.y;
      ctx.fillStyle="#2A211A"; ctx.fillRect(o.x+4, base-8, o.w-8, 8);
      ctx.strokeStyle=C.metal; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(x-15,base); ctx.lineTo(x-5,topo);
      ctx.moveTo(x+15,base); ctx.lineTo(x+5,topo);
      ctx.stroke();
      ctx.strokeStyle=C.metalClaro; ctx.lineWidth=1.6;
      const seg=5;
      for(let k=0;k<=seg;k++){
        const t=k/seg, y=base+(topo-base)*t, dx=15-10*t;
        ctx.beginPath(); ctx.moveTo(x-dx,y); ctx.lineTo(x+dx,y); ctx.stroke();
        if(k<seg){
          const t2=(k+1)/seg, y2=base+(topo-base)*t2, dx2=15-10*t2;
          ctx.beginPath();
          ctx.moveTo(x-dx,y); ctx.lineTo(x+dx2,y2);
          ctx.moveTo(x+dx,y); ctx.lineTo(x-dx2,y2);
          ctx.stroke();
        }
      }
      ctx.fillStyle="#8A8072";
      ctx.beginPath(); ctx.ellipse(x-14,topo+18,6,11,-.5,0,TAU); ctx.fill();
      const b=.5+.5*Math.sin(o.f*2);
      ctx.fillStyle=`rgba(255,74,74,${.55+b*.45})`;
      ctx.shadowColor=C.perigo; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(x,topo-4,5,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle=`rgba(255,74,74,${.18*b})`; ctx.lineWidth=2;
      for(let k=1;k<=2;k++){ ctx.beginPath(); ctx.arc(x,topo-4,10+k*9,0,TAU); ctx.stroke(); }
      etiqueta("ANTENA", x, base+22, "255,140,140");

    } else if(o.tipo==="cabo"){
      const y=o.y+12;
      ctx.lineCap="round";
      ctx.strokeStyle="#4A4034"; ctx.lineWidth=8;
      ctx.beginPath();
      for(let t=0;t<=1.001;t+=.05){
        const px=o.x+t*o.w, py=y+9*Math.sin(t*7+o.f);
        t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke();
      ctx.strokeStyle="#6E6155"; ctx.lineWidth=4.5;
      ctx.beginPath();
      for(let t=0;t<=1.001;t+=.05){
        const px=o.x+t*o.w, py=y+4+7*Math.sin(t*6+o.f+1);
        t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke();
      ctx.lineCap="butt";
      ctx.fillStyle="#A0958A"; ctx.fillRect(o.x+o.w-14,y-9,14,18);
      ctx.fillStyle="#2B241E";
      ctx.fillRect(o.x+o.w-4,y-5,6,4); ctx.fillRect(o.x+o.w-4,y+1,6,4);
      ctx.fillStyle=o.led; ctx.shadowColor=o.led; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(o.x+o.w-9,y,2.6,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
      etiqueta("CABOS", o.x+o.w/2, CHAO+22, "200,185,165");

    } else if(o.tipo==="estatica"){
      const cx=o.x+o.w/2;
      ctx.save();
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(o.x,o.y,o.w,o.h,10) : ctx.rect(o.x,o.y,o.w,o.h);
      ctx.clip();
      ctx.fillStyle="rgba(190,180,165,.15)"; ctx.fillRect(o.x,o.y,o.w,o.h);
      for(let i=0;i<26;i++){
        ctx.fillStyle=`rgba(245,240,230,${R(.15,.6)})`;
        ctx.fillRect(o.x+R(0,o.w), o.y+R(0,o.h), R(2,7), R(1,2.5));
      }
      ctx.restore();
      ctx.strokeStyle="rgba(225,215,200,.45)"; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(o.x,o.y,o.w,o.h,10) : ctx.rect(o.x,o.y,o.w,o.h);
      ctx.stroke();
      ctx.strokeStyle="rgba(225,215,200,.18)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx,o.y); ctx.lineTo(cx,0); ctx.stroke();
      etiqueta("ESTÁTICA — PASSA POR BAIXO", cx, o.y-12, "230,220,205");

    } else {
      const cx=o.x+o.w/2, cy=o.y+o.h/2;
      const amp=.55+.45*Math.sin(o.f*1.6);
      ctx.strokeStyle=`rgba(255,74,74,${.5+.3*amp})`;
      ctx.lineWidth=3.4; ctx.lineCap="round";
      ctx.beginPath();
      for(let t=0;t<=1.001;t+=.03){
        const px=o.x+t*o.w, py=cy+18*Math.sin(t*14+o.f)*amp;
        t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.lineCap="butt";
      ctx.fillStyle=`rgba(255,74,74,${.7+.3*amp})`;
      ctx.beginPath();
      ctx.moveTo(cx,cy-24); ctx.lineTo(cx-11,cy-6); ctx.lineTo(cx+11,cy-6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle="#1A0A0A"; ctx.font="700 11px 'DM Mono', monospace";
      ctx.fillText("!", cx, cy-9);
      etiqueta("MICROFONIA", cx, o.y+o.h+18, "255,140,140");
    }
  }
}

/* ═════════════ desenho: itens ═════════════ */
function desenhaItens(){
  ctx.textAlign="center";
  for(const it of itens){
    const y=it.y+Math.sin(it.osc)*8;
    const halo=ctx.createRadialGradient(it.x,y,2,it.x,y,40);
    halo.addColorStop(0,"rgba(255,212,137,.18)");
    halo.addColorStop(1,"rgba(255,212,137,0)");
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(it.x,y,40,0,TAU); ctx.fill();

    if(it.tipo==="mic"){
      ctx.fillStyle="#CFC6B8";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(it.x-9,y-20,18,26,9) : ctx.rect(it.x-9,y-20,18,26);
      ctx.fill();
      ctx.fillStyle="rgba(45,38,32,.55)";
      for(let gy=-16;gy<2;gy+=4) for(let gx=-6;gx<=6;gx+=4) ctx.fillRect(it.x+gx,y+gy,2,2);
      ctx.strokeStyle="#9C9184"; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(it.x,y-4,14,.15*Math.PI,.85*Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(it.x,y+10); ctx.lineTo(it.x,y+20); ctx.stroke();
      ctx.fillStyle="#6B6257";
      ctx.beginPath(); ctx.ellipse(it.x,y+21,9,3.4,0,0,TAU); ctx.fill();
      ctx.fillStyle=C.perigo; ctx.shadowColor=C.perigo; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(it.x,y-24,2.4,0,TAU); ctx.fill();
      ctx.shadowBlur=0;

    } else if(it.tipo==="auscultadores"){
      ctx.strokeStyle="#8FD3C8"; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(it.x,y-2,17,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
      ctx.fillStyle="#4E9E92";
      [-17,17].forEach(ox=>{
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(it.x+ox-6,y-6,12,20,6) : ctx.rect(it.x+ox-6,y-6,12,20);
        ctx.fill();
      });
      ctx.fillStyle="#14332F";
      [-17,17].forEach(ox=>{
        ctx.beginPath(); ctx.ellipse(it.x+ox,y+4,3.4,6,0,0,TAU); ctx.fill();
      });

    } else {
      ctx.save();
      ctx.translate(it.x,y);
      ctx.rotate(Math.sin(it.ang)*.12);
      ctx.fillStyle=C.ambar;
      ctx.beginPath(); ctx.ellipse(-6,10,9,6.6,-.35,0,TAU); ctx.fill();
      ctx.fillRect(1.6,-18,3.2,27);
      ctx.beginPath();
      ctx.moveTo(4.8,-18);
      ctx.quadraticCurveTo(19,-13,13,2);
      ctx.quadraticCurveTo(16,-10,4.8,-11);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function desenhaPowers(){
  for(const pw of powers){
    const p=1+.12*Math.sin(pw.p);
    ctx.strokeStyle="rgba(232,163,60,.5)"; ctx.lineWidth=2;
    for(let k=0;k<3;k++){
      ctx.globalAlpha=.5-k*.14;
      ctx.beginPath(); ctx.arc(pw.x,pw.y,(13+k*8)*p,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=C.ambar; ctx.shadowColor=C.ambar; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(pw.x,pw.y,11*p,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#2A1705";
    for(let k=0;k<3;k++) ctx.fillRect(pw.x-6+k*5, pw.y+4-k*4, 3, 4+k*4);
  }
}

/* ═════════════ ícone Instagram ═════════════ */
function iconInsta(g,x,y,s,cor){
  g.save();
  g.strokeStyle=cor; g.lineWidth=Math.max(1,s*0.1);
  g.beginPath();
  g.roundRect ? g.roundRect(x,y,s,s,s*0.28) : g.rect(x,y,s,s);
  g.stroke();
  g.beginPath(); g.arc(x+s/2,y+s/2,s*0.24,0,TAU); g.stroke();
  g.fillStyle=cor;
  g.beginPath(); g.arc(x+s*0.76,y+s*0.24,s*0.07,0,TAU); g.fill();
  g.restore();
}

/* ═════════════ mostrador RDS ═════════════ */
function rds(){
  ctx.save();
  ctx.fillStyle="rgba(10,8,7,.55)";
  ctx.fillRect(0,0,W,26);
  ctx.strokeStyle="rgba(232,163,60,.18)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,26.5); ctx.lineTo(W,26.5); ctx.stroke();

  ctx.font="500 12px 'DM Mono', monospace";
  ctx.textAlign="left"; ctx.textBaseline="middle";
  const larg = ctx.measureText(RDS).width || 600;
  let x = -((T*0.9) % larg);
  ctx.fillStyle="rgba(232,163,60,.65)";
  while(x < W){ ctx.fillText(RDS, x, 13); x += larg; }

  // conta de Instagram fixa à direita
  ctx.fillStyle="rgba(10,8,7,.92)"; ctx.fillRect(W-146,0,146,26);
  iconInsta(ctx, W-136, 6, 14, "rgba(255,212,137,.9)");
  ctx.fillStyle=C.ambarClaro;
  ctx.textAlign="right";
  ctx.font="500 11px 'DM Mono', monospace";
  ctx.fillText("@REO_VIZELA_", W-10, 13);
  ctx.restore();
  ctx.textBaseline="alphabetic";
}

/* ═════════════ sobreposições ═════════════ */
function painel(titulo, linhas, cor){
  ctx.fillStyle="rgba(8,6,5,.86)"; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, 150);
  logoREO(ctx, 52, {});
  ctx.restore();
  ctx.textAlign="center";
  ctx.fillStyle=cor;
  ctx.font="700 40px 'Space Grotesk', system-ui, sans-serif";
  ctx.fillText(titulo, W/2, 268);
  ctx.font="500 14px 'DM Mono', monospace";
  ctx.fillStyle="rgba(243,230,210,.6)";
  linhas.forEach((l,i)=> ctx.fillText(l, W/2, 306+i*26));
}

function sobreposicoes(){
  if(flashDano>0){
    ctx.fillStyle=`rgba(255,74,74,${flashDano*.26})`; ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){
      ctx.fillStyle=`rgba(255,245,230,${R(.05,.25)*flashDano})`;
      ctx.fillRect(R(0,W),R(0,H),R(10,60),R(1,3));
    }
  }
  if(flashNivel>0){
    ctx.fillStyle=`rgba(232,163,60,${flashNivel*.12})`; ctx.fillRect(0,0,W,H);
  }

  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.6)");
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  rds();

  if(aJogar && !fim && !pausa){
    ctx.textAlign="left";
    ctx.font="500 10px 'DM Mono', monospace";
    ctx.fillStyle="rgba(243,230,210,.4)";
    ctx.fillText(localAtual().toUpperCase(), 20, 46);
  }
  if(inv>60){
    ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(W/2-60,40,120,5);
    ctx.fillStyle="#8FD3C8"; ctx.fillRect(W/2-60,40,120*clamp(inv/200,0,1),5);
  }
  if(rolarCD>0){
    ctx.fillStyle="rgba(232,163,60,.25)"; ctx.fillRect(20,H-24,90*(1-rolarCD/46),4);
  } else if(aJogar && !fim){
    ctx.fillStyle="rgba(232,163,60,.7)"; ctx.fillRect(20,H-24,90,4);
    ctx.font="500 9px 'DM Mono', monospace"; ctx.textAlign="left";
    ctx.fillStyle="rgba(232,163,60,.6)";
    ctx.fillText("ROLAR PRONTO", 20, H-30);
  }

  if(fim){
    painel("FORA DE ANTENA", [
      ouvintes + " ouvintes   ·   recorde " + recorde,
      "chegaste a: " + localAtual(),
      "",
      "Carrega em Jogar para voltar ao ar",
      "segue a rádio em @REO_VIZELA_"
    ], C.perigo);
  } else if(!aJogar){
    ctx.fillStyle="rgba(8,6,5,.84)"; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(W/2,152); logoREO(ctx,56,{}); ctx.restore();
    ctx.textAlign="center";
    ctx.fillStyle=C.creme;
    ctx.font="700 46px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText("REO Dash", W/2, 268);
    ctx.font="500 12px 'DM Mono', monospace";
    ctx.fillStyle=C.ambar;
    ctx.fillText("RÁDIO ESCOLAR ONLINE · AGRUPAMENTO DE ESCOLAS DE S. BENTO, VIZELA", W/2, 294);
    ctx.fillStyle="rgba(255,212,137,.8)";
    ctx.font="500 13px 'DM Mono', monospace";
    iconInsta(ctx, W/2-64, 306, 13, "rgba(255,212,137,.8)");
    ctx.textAlign="left";
    ctx.fillText("@REO_VIZELA_", W/2-44, 317);
    ctx.textAlign="center";
    ctx.fillStyle="rgba(243,230,210,.62)";
    ctx.font="500 14px 'DM Mono', monospace";
    ctx.fillText("Leva a emissão do estúdio até ao alto do monte.", W/2, 340);
    ctx.fillText("Apanha microfones, notas e auscultadores para ganhar ouvintes.", W/2, 364);
    ctx.fillStyle=C.ambarClaro;
    ctx.fillText("Espaço ou toque para saltar · Shift para rolar", W/2, 404);
  } else if(pausa){
    painel("EM PAUSA", ["Carrega em Jogar ou P para continuar"], C.creme);
  }
}

/* ═════════════ ciclo ═════════════ */
function desenhar(){
  ctx.save();
  if(tremor>.5 && !menosMovimento) ctx.translate(R(-tremor,tremor)*.5, R(-tremor,tremor)*.5);

  fundo();
  desenhaPlacas();
  chao();

  for(const o of ondas){
    ctx.strokeStyle=`rgba(${o.cor},${o.vida*.5})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,TAU); ctx.stroke();
  }

  desenhaPowers();
  desenhaItens();
  desenhaObstaculos();
  heroi();

  for(const m of migalhas){
    ctx.save();
    ctx.globalAlpha=m.vida;
    ctx.translate(m.x,m.y); ctx.rotate(m.rot);
    ctx.fillStyle="#241F1B";
    ctx.fillRect(-m.r,-m.r*.7,m.r*2,m.r*1.4);
    ctx.restore();
  }
  ctx.globalAlpha=1;

  for(const p of part){
    ctx.globalAlpha=p.vida; ctx.fillStyle=p.cor;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.vida,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.textAlign="center";
  for(const f of texto){
    ctx.globalAlpha=f.vida; ctx.fillStyle=f.cor;
    ctx.font=`700 ${f.tam}px 'Space Grotesk', system-ui, sans-serif`;
    ctx.shadowColor="rgba(0,0,0,.75)"; ctx.shadowBlur=8;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  sobreposicoes();
  ctx.restore();
}

let anterior = performance.now();
function ciclo(agora){
  const d = clamp((agora-anterior)/16.6667, 0, 2.6);
  anterior = agora;
  atualizar(d);
  desenhar();
  requestAnimationFrame(ciclo);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(w<2*r) r=w/2; if(h<2*r) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

reiniciar();
requestAnimationFrame(ciclo);
})();
</script>
